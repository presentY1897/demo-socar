# 프로젝트명 고정 — worktree 디렉토리명(main 등)이 바뀌어도 볼륨/네트워크가 유지된다
name: socar

services:
  db:
    image: postgres:16-alpine
    container_name: socar-db
    environment:
      POSTGRES_USER: socar
      POSTGRES_PASSWORD: socar
      POSTGRES_DB: socar
    ports:
      - "5432:5432"
    volumes:
      - socar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socar"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  socar-pgdata:
